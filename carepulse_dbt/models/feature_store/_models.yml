version: 2
models:
- name: "episode_features"
  description: "One row per eligible inpatient episode with point-in-time features. unplanned_readmitted_30d is the model label; readmitted_30d (includes scheduled chemotherapy) is kept for comparison only. Never use either label as a feature."
  columns:
    - name: "episode_id"
      data_tests:
        - not_null
        - unique
    - name: "patient_id"
      data_tests:
        - not_null
        - relationships:
            arguments:
              to: ref('patients')
              field: patient_id
    - name: "gender"
      data_tests:
        - not_null
    - name: "age_at_admission"
      data_tests:
        - not_null
    - name: "length_of_stay_days"
      data_tests:
        - not_null
    - name: "prior_episodes"
      data_tests:
        - not_null 
    - name: "readmitted_30d"
      data_tests:
        - not_null  
    - name: "unplanned_readmitted_30d"
      data_tests:
        - not_null      
    - name: "prior_episodes_365d"
      data_tests:
        - not_null       
    - name: "active_disorders_at_discharge"
      data_tests:
        - not_null